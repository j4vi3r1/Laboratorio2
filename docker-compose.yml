services:
  app:
    build: ./app
    container_name: php_crud_app
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=secret_password
      - DB_NAME=crud_db
    networks:
      - crud_network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_crud_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret_password
      MYSQL_DATABASE: crud_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - crud_network

networks:
  crud_network:
    driver: bridge

volumes:
  db_data:
